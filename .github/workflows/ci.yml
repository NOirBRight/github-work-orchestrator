name: GWO CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Create isolated test environment
        shell: pwsh
        run: |
          $venvPath = Join-Path $env:RUNNER_TEMP ("gwo-ci-venv-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          & python -m venv $venvPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venvPath "Scripts\python.exe"
          & $venvPython -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip install --require-hashes --only-binary=:all: --no-cache-dir -r ".github/requirements-ci-win-py313.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GWO_CI_PYTHON=$venvPython" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Report hosted runner provenance
        shell: pwsh
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
          & "$env:GWO_CI_PYTHON" --version
          git rev-parse HEAD
      - name: Run repository acceptance
        shell: pwsh
        timeout-minutes: 30
        run: '& "$env:GWO_CI_PYTHON" -m pytest -q'
      - name: Validate Skill packages
        shell: pwsh
        run: '& "$env:GWO_CI_PYTHON" scripts/quick_validate.py'
