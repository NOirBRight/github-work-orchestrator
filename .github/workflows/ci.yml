name: GWO CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64, gwo-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run repository acceptance
        run: python -m pytest -q
      - name: Validate Skill packages
        run: python scripts/quick_validate.py
